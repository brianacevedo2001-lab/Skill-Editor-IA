<!doctype html>
<!-- Anuncio de producto con locución (9:16 «Anuncio» y 4:5 «AnuncioLinkedin»), equivalente a remotion/src/promo/Anuncio.tsx.
     Guion: videos/<id>/anuncio.json (mismas claves: voz, duracion, escenas[{tipo, from, to, transicion, at:{…}}]).
     La música NO va aquí: pipeline/anuncio.py la mezcla al exportar (YouTube con música; IG/TikTok/LinkedIn sin ella).
     pipeline/motor.py copia esta carpeta a out/hyperframes/<trabajo>/ y rellena los marcadores. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__ANCHO__, height=__ALTO__" />
    <title>Anuncio</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--MARCA-->
    <link rel="stylesheet" href="assets/comun/hf.css" />
    <script src="assets/datos.js"></script>
  </head>
  <body>
    <div id="raiz" data-composition-id="anuncio" data-start="0" data-width="__ANCHO__" data-height="__ALTO__"
         data-duration="__DURACION__" style="width: __ANCHO__px; height: __ALTO__px">
      <div id="fondo" class="capa" data-layout-ignore></div>
      <!--CLIPS-->
      <!--MEDIOS-->
    </div>
    <script src="assets/comun/hf.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      HF.montarFondo(tl, document.getElementById("fondo"), false);
      HF.montarEscenas(tl);
      HF.montarTransiciones(tl);
      window.__timelines["anuncio"] = tl;
    </script>
  </body>
</html>
